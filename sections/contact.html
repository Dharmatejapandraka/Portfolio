<!-- =========================================================
     CONTACT SECTION PARTIAL
     Injected into #contact-placeholder by sections-loader.js
     ========================================================= -->
<section id="contact">
  <div class="container-custom">
    <div class="section-head reveal">
      <h2 class="section-heading">Let's work together</h2>
      <p class="section-sub">Have a role, project, or idea in mind? My inbox is open.</p>
    </div>

    <div class="contact-grid">
      <div class="glass-card contact-form-card reveal">
        <form id="contactForm" novalidate>
          <div class="form-group">
            <input type="text" id="name" name="name" placeholder=" " required>
            <label for="name">Your Name</label>
          </div>
          <div class="form-group">
            <input type="email" id="email" name="email" placeholder=" " required>
            <label for="email">Your Email</label>
          </div>
          <div class="form-group">
            <input type="text" id="subject" name="subject" placeholder=" " required>
            <label for="subject">Subject</label>
          </div>
          <div class="form-group">
            <textarea id="message" name="message" placeholder=" " required></textarea>
            <label for="message">Message</label>
          </div>
          <button type="submit" class="btn-glow"><i class="fa-regular fa-paper-plane"></i> Send Message</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="glass-card contact-info-card reveal reveal-delay-1">
        <div class="contact-info-item">
          <span class="contact-info-icon"><i class="fa-regular fa-envelope"></i></span>
          <div>
            <div class="contact-info-label">Email</div>
            <div class="contact-info-value">pandrakadharmateja@gmail.com</div>
          </div>
        </div>
        <div class="contact-info-item">
          <span class="contact-info-icon"><i class="fa-solid fa-location-dot"></i></span>
          <div>
            <div class="contact-info-label">Location</div>
            <div class="contact-info-value">Andhra Pradesh, India</div>
          </div>
        </div>
        <div class="contact-info-item">
          <span class="contact-info-icon"><i class="fa-brands fa-github"></i></span>
          <div>
            <div class="contact-info-label">GitHub</div>
            <div class="contact-info-value">https://github.com/Dharmatejapandraka</div>
          </div>
        </div>

        <div class="contact-socials">
          <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub profile"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.linkedin.com/in/dharma-teja-pandraka-0132b334a/" target="_blank" rel="noopener" aria-label="LinkedIn profile"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="mailto:dharmateja@example.com" aria-label="Send email"><i class="fa-regular fa-envelope"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
